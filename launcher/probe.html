<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Probe</title></head>
<body style="background:#000;color:#fff;font:32px sans-serif;padding:80px">Checking graphics…
<script>
// Reports what the TV's browser can do to the server log, then returns to the launcher.
(function () {
  var r = { ua: navigator.userAgent, w: screen.width, h: screen.height, dpr: window.devicePixelRatio };
  var c = document.createElement('canvas'), gl = null;
  try { gl = c.getContext('webgl') || c.getContext('experimental-webgl'); } catch (e) {}
  r.webgl = !!gl;
  try { r.webgl2 = !!document.createElement('canvas').getContext('webgl2'); } catch (e) { r.webgl2 = false; }
  if (gl) {
    var dbg = gl.getExtension('WEBGL_debug_renderer_info');
    r.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    r.vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    r.maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  }
  // rough frame rate over 2 seconds
  var n = 0, t0 = performance.now();
  function f(t) {
    n++;
    if (t - t0 < 2000) return requestAnimationFrame(f);
    r.fps = Math.round(n / ((t - t0) / 1000));
    new Image().src = '/_log?probe=' + encodeURIComponent(JSON.stringify(r));
    setTimeout(function () { location.href = '/'; }, 800);
  }
  requestAnimationFrame(f);
})();
</script></body></html>
