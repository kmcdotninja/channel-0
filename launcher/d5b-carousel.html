<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel 2</title>
<style>
/* Design 5: every app is a festival poster on a curved ribbon. The centred poster faces you; the rest wrap away
   around a cylinder. Posters are built from each app: its colour, its logo, its name set huge.
   Drawn with WebGL: each poster is painted once into a 2D canvas, uploaded as a texture and bent onto the cylinder in
   the vertex shader; a spring drives the scroll and its velocity feeds the shaders. CSS 3D is the fallback. */
@font-face { font-family: Anton; src: url(fonts/Anton-Regular.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: Unbounded; src: url(fonts/Unbounded-ExtraBold.woff2) format("woff2"); font-weight: 800; }
@font-face { font-family: Inter; src: url(fonts/Inter-Regular.woff2) format("woff2"); font-weight: 400; }
:root { --ease: cubic-bezier(.22,1,.36,1); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
body { font-family: Inter, -apple-system, Arial, sans-serif; color: #fff; outline: none; -webkit-font-smoothing: antialiased; }
#stage { width: 1920px; height: 1080px; transform-origin: 0 0; position: absolute; top: 0; left: 0; overflow: hidden; background: #000; }

/* ---------- header ---------- */
.top { position: absolute; top: 40px; left: 72px; right: 72px; height: 60px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
.clock { display: flex; align-items: baseline; }
.clock b { font: 400 46px/1 Anton, sans-serif; letter-spacing: .01em; }
.clock span { margin-left: 16px; font-size: 20px; color: rgba(255,255,255,.6); letter-spacing: -.01em; }
.mode { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 800 17px/1 Unbounded, sans-serif; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.mode i { font-style: normal; color: rgba(255,255,255,.45); }
.vol { font: 800 17px/1 Unbounded, sans-serif; letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; }
.vol .bars { display: flex; align-items: flex-end; height: 22px; margin-left: 14px; }
.vol .bars i { width: 5px; margin-left: 3px; background: rgba(255,255,255,.22); border-radius: 2px; }
.vol .bars i.on { background: #fff; }

/* ---------- ribbon ---------- */
.floor { position: absolute; left: 160px; right: 160px; top: 760px; height: 300px; background: radial-gradient(ellipse at 50% 35%, rgba(120,80,255,.3), rgba(0,0,0,0) 65%); transition: background .8s ease; }
#gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
#scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; perspective: 1700px; perspective-origin: 50% 520px; }
#ring { position: absolute; left: 960px; top: 520px; width: 0; height: 0; transform-style: preserve-3d; transform: translateZ(-1400px); }

/* CSS 3D fallback posters (used only when WebGL is unavailable) */
.card { position: absolute; left: -230px; top: -320px; width: 460px; height: 640px; border-radius: 22px; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden; transform-origin: 50% 50%;
  transition: transform .62s var(--ease), opacity .45s var(--ease); will-change: transform; }
.card.instant { transition: none; }
.card .bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
.card svg.arcs { position: absolute; top: 0; left: 0; width: 460px; height: 640px; }
.card .shade { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000; opacity: 0; transition: opacity .5s var(--ease); pointer-events: none; }
.card .cap { position: absolute; left: 0; right: 0; white-space: nowrap; overflow: hidden; font: 800 13px/1 Unbounded, sans-serif; letter-spacing: .1em; text-transform: uppercase; opacity: .92; }
.card .cap.t { top: 16px; } .card .cap.b { bottom: 14px; }
.card .mark { position: absolute; left: 38px; top: 48px; font: 800 34px/.86 Unbounded, sans-serif; letter-spacing: -.02em; text-transform: lowercase; transform: rotate(-6deg); transform-origin: 0 0; }
.card .mark small { display: block; font-size: 22px; margin-top: 6px; }
.card .logo { position: absolute; left: 50%; top: 214px; width: 196px; height: 196px; margin: -98px 0 0 -98px; border-radius: 46px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.35); }
.card .logo img { width: 100%; height: 100%; display: block; }
.card .logo.mono, .card .logo.glyph { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.14); box-shadow: none; }
.card .logo.mono { background: transparent; border: 5px solid currentColor; font: 800 82px/1 Unbounded, sans-serif; letter-spacing: -.04em; }
.card .logo.glyph svg { width: 110px; height: 110px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.card .name { position: absolute; left: 36px; right: 36px; top: 356px; height: 160px; display: flex; align-items: flex-end; font: 400 120px/.9 Anton, sans-serif; text-transform: uppercase; letter-spacing: .005em; overflow: hidden; word-wrap: break-word; }
.card .name span { display: block; }
.card .meta { position: absolute; left: 36px; right: 36px; bottom: 44px; display: flex; justify-content: space-between; align-items: flex-end; }
.card .meta div { line-height: 1; }
.card .meta b { display: block; font: 400 44px/1 Anton, sans-serif; letter-spacing: .01em; }
.card .meta small { display: block; font: 800 12px/1 Unbounded, sans-serif; letter-spacing: .1em; text-transform: uppercase; margin-top: 8px; opacity: .85; }
.card .meta .r { text-align: right; }
.card .live { display: inline-block; padding: 7px 10px 6px; border-radius: 999px; font: 800 12px/1 Unbounded, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.card.center { box-shadow: 0 40px 120px rgba(0,0,0,.6); }

/* ---------- chips ---------- */
.chips { position: absolute; left: 0; right: 0; top: 944px; display: flex; justify-content: center; z-index: 5; }
.chip { height: 58px; padding: 0 30px; margin: 0 8px; border-radius: 999px; display: flex; align-items: center; border: 2px solid rgba(255,255,255,.22);
  font: 800 16px/1 Unbounded, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.75); background: rgba(0,0,0,.35);
  transition: background-color .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease); }
.chip.on { background: #fff; color: #000; border-color: #fff; transform: scale(1.06); }
.hint { position: absolute; left: 0; right: 0; top: 1022px; text-align: center; font-size: 17px; color: rgba(255,255,255,.4); letter-spacing: -.01em; z-index: 5; }

/* ---------- ambient ---------- */
#ambient { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 20; background: #000 center/cover no-repeat; opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s .6s; }
#ambient.on { opacity: 1; visibility: visible; transition: opacity .6s ease; }
#ambient .sh { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.7)); }
#ambient .t { position: absolute; left: 90px; bottom: 80px; font: 400 230px/.85 Anton, sans-serif; }
#ambient .d { position: absolute; left: 96px; bottom: 50px; font: 800 18px/1 Unbounded, sans-serif; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
#ambient .c { position: absolute; right: 90px; bottom: 56px; text-align: right; font-size: 20px; opacity: .8; }

/* ---------- search ---------- */
#gl { transition: transform .6s var(--ease); transform-origin: 960px 520px; }
.floor { transform-origin: 800px -240px; transition: background .8s ease, transform .6s var(--ease); }
.chips, .hint { transition: opacity .3s var(--ease); }
body.searching #gl, body.searching .floor { transform: translateX(310px) scale(.8); }
body.searching .chips, body.searching .hint { opacity: 0; pointer-events: none; }
#search { position: absolute; left: 56px; top: 116px; bottom: 36px; width: 640px; z-index: 12; padding: 28px 23px; border-radius: 34px;
  background: linear-gradient(160deg, rgba(35,55,255,.26), rgba(255,47,160,.10) 55%, rgba(0,0,0,0) 80%), rgba(8,8,16,.9);
  border: 1px solid rgba(255,255,255,.12); box-shadow: 0 40px 120px rgba(0,0,0,.65);
  opacity: 0; visibility: hidden; transform: translateX(-48px); transition: opacity .3s var(--ease), transform .5s var(--ease), visibility 0s .5s; }
body.searching #search { opacity: 1; visibility: visible; transform: none; transition: opacity .3s var(--ease), transform .5s var(--ease); }
.sp-top { display: flex; justify-content: space-between; align-items: baseline; }
.sp-label { font: 800 13px/1 Unbounded, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.55); }
.sp-label b { color: #fff; font-weight: 800; }
.sp-q { height: 108px; margin-top: 12px; display: flex; align-items: flex-end; white-space: nowrap; overflow: hidden; font: 400 100px/1 Anton, sans-serif; text-transform: uppercase; letter-spacing: .005em; }
.sp-q .ph { color: rgba(255,255,255,.22); }
.sp-q .ch { display: inline-block; animation: chIn .28s var(--ease) both; }
@keyframes chIn { from { transform: translateY(26px) scale(.7); opacity: 0; } }
.caret { display: inline-block; width: 7px; height: 84px; margin: 0 0 8px 8px; border-radius: 4px; background: #ff2fa0; box-shadow: 0 0 18px rgba(255,47,160,.8); animation: blink 1.05s steps(1) infinite; flex: none; }
@keyframes blink { 50% { opacity: 0; } }
.kb { position: relative; height: 382px; margin-top: 16px; }
.key { position: absolute; top: 0; left: 0; height: 70px; border-radius: 16px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center;
  font: 400 38px/1 Anton, sans-serif; color: rgba(255,255,255,.82); z-index: 1; transition: color .18s var(--ease), transform .16s var(--ease), background-color .18s; }
.key.fn { font: 800 13px/1 Unbounded, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
.key.fn.del { font: 400 34px/1 Inter, sans-serif; }
.key.on { color: #fff; background: transparent; }
.key.press { transform: scale(.86); }
#kfocus { position: absolute; left: 0; top: 0; width: 78px; height: 70px; border-radius: 16px; z-index: 0;
  background: linear-gradient(135deg, #ff2fa0 0%, #8a2bff 55%, #2337ff 100%); box-shadow: 0 12px 34px rgba(255,47,160,.45), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .22s cubic-bezier(.2,1.25,.4,1), width .22s cubic-bezier(.2,1.25,.4,1), opacity .2s; }
#kfocus.press { animation: kPulse .32s var(--ease); }
@keyframes kPulse { 40% { box-shadow: 0 0 0 10px rgba(255,47,160,.25), 0 12px 34px rgba(255,47,160,.55); } }
#kfocus.off { opacity: 0; }
.sp-res { margin-top: 24px; }
#res { margin-top: 10px; }
.rrow { display: flex; align-items: center; height: 62px; padding: 0 16px 0 10px; margin-bottom: 6px; border-radius: 18px; font: 400 32px/1 Anton, sans-serif; text-transform: uppercase;
  color: rgba(255,255,255,.88); transition: background-color .2s var(--ease), color .2s var(--ease), transform .2s var(--ease); animation: rIn .35s var(--ease) both; }
@keyframes rIn { from { opacity: 0; transform: translateX(-18px); } }
.rrow .ic { width: 42px; height: 42px; border-radius: 11px; flex: none; overflow: hidden; display: flex; align-items: center; justify-content: center; font: 800 15px/1 Unbounded, sans-serif; }
.rrow .ic img { width: 100%; height: 100%; display: block; }
.rrow .nm { flex: 1; margin-left: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .go { font: 800 11px/1 Unbounded, sans-serif; letter-spacing: .14em; opacity: 0; transition: opacity .2s; }
.rrow .hl { color: #ff4fb1; }
.rrow.on { background: #fff; color: #08080f; transform: translateX(6px); }
.rrow.on .hl { color: #e0006f; }
.rrow.on .go { opacity: .55; }
.empty { font-size: 22px; line-height: 1.35; color: rgba(255,255,255,.7); letter-spacing: -.01em; padding: 6px 10px 12px; }
.empty b { font: 400 30px/1.1 Anton, sans-serif; color: #fff; text-transform: uppercase; display: block; margin-bottom: 6px; }

/* ---------- volume HUD ---------- */
#vhud { position: absolute; right: 64px; top: 140px; width: 360px; height: 440px; z-index: 25; border-radius: 28px; overflow: hidden; color: #fff;
  background: linear-gradient(160deg, #2337ff 0%, #2337ff 42%, #8a2bff 100%); box-shadow: 0 40px 120px rgba(0,0,0,.6);
  opacity: 0; transform: translateY(-18px) scale(.95); transition: opacity .3s var(--ease), transform .5s var(--ease); pointer-events: none; }
#vhud.on { opacity: 1; transform: none; }
#vhud svg { position: absolute; top: 0; left: 0; width: 360px; height: 440px; }
#vhud .cap { position: absolute; left: 0; right: 0; top: 18px; white-space: nowrap; overflow: hidden; font: 800 13px/1 Unbounded, sans-serif; letter-spacing: .1em; text-transform: uppercase; opacity: .92; }
#vhud .lbl { position: absolute; left: 30px; top: 58px; font: 800 30px/.86 Unbounded, sans-serif; letter-spacing: -.02em; transform: rotate(-6deg); transform-origin: 0 0; }
#vhud .n { position: absolute; left: 26px; bottom: 82px; font: 400 230px/.8 Anton, sans-serif; letter-spacing: -.01em; transition: transform .25s var(--ease); }
#vhud .n.bump { transform: scale(1.06); }
#vhud .bar { position: absolute; left: 30px; right: 30px; bottom: 36px; display: flex; align-items: flex-end; height: 30px; }
#vhud .bar i { flex: 1; margin-right: 4px; border-radius: 3px; background: rgba(255,255,255,.25); transition: background-color .2s, height .2s var(--ease); }
#vhud .bar i:last-child { margin-right: 0; }
#vhud .bar i.on { background: #fff; }
#vhud.muted { background: linear-gradient(160deg, #3a3a44 0%, #1d1d24 100%); }

#toast { position: absolute; left: 50%; top: 116px; z-index: 30; transform: translateX(-50%) translateY(-8px); padding: 14px 26px; border-radius: 999px; background: #fff; color: #000;
  font: 800 16px/1 Unbounded, sans-serif; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; opacity: 0; transition: opacity .2s var(--ease), transform .2s var(--ease); }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { background: #ff3b5c; color: #fff; }
</style>
</head>
<body tabindex="-1">
<div id="stage">
  <div class="top">
    <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
    <div class="mode" id="mode">Apps <i>01 / --</i></div>
    <div class="vol">Vol <span id="vol" style="margin-left:10px">--</span><span class="bars" id="bars"></span></div>
  </div>

  <div class="floor" id="floor"></div>
  <canvas id="gl" width="1920" height="1080"></canvas>

  <div class="chips" id="chips">
    <div class="chip" data-act="search">Search</div>
    <div class="chip" data-act="inputs" id="chip-mode">Inputs</div>
    <div class="chip" data-act="photos">Photos</div>
    <div class="chip" data-act="settings">Settings</div>
  </div>
  <div class="hint" id="hint">◀ ▶ to browse · OK to open · ▼ for more</div>

  <div id="search">
    <div class="sp-top"><span class="sp-label">Search apps</span><span class="sp-label" id="qcount"></span></div>
    <div class="sp-q" id="qbox"><span id="qtext"></span><i class="caret"></i></div>
    <div class="kb" id="kb"><div id="kfocus"></div></div>
    <div class="sp-res"><div class="sp-top"><span class="sp-label" id="res-label">Recent</span><span class="sp-label" id="res-hint">▼ to pick · OK to open</span></div><div id="res"></div></div>
  </div>

  <div id="vhud"><svg viewBox="0 0 360 440"><circle cx="330" cy="120" r="210" fill="none" stroke="#ff2fa0" stroke-width="40" opacity=".95"/><circle cx="330" cy="120" r="150" fill="none" stroke="#ff2fa0" stroke-width="9" opacity=".7"/><circle cx="-10" cy="430" r="170" fill="#ff2fa0" opacity=".16"/></svg>
    <div class="cap" id="vh-cap"></div><div class="lbl">vol<br>ume</div><div class="n" id="vh-n">--</div><div class="bar" id="vh-bar"></div></div>

  <div id="ambient"><div class="sh"></div><div class="t" id="am-time"></div><div class="d" id="am-date"></div><div class="c" id="am-credit"></div></div>
  <div id="toast"></div>
</div>

<script src="designs.js"></script>
<script>window.D5_STYLE = 'bauhaus';</script>
<script src="d5-carousel.js"></script>
</body>
</html>
